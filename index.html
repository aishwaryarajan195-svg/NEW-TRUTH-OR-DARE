<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRUTH or DARE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070617; --panel:#120f2b; --ink:#f2f0ff; --mute:#8d88b8;
    --p0:#00f0ff; --p1:#ffb300;
    --truth:#3da9ff; --dare:#ff4057; --good:#2cff9a; --gold:#ffd400;
    --font:'Orbitron','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100vh; color:var(--ink); font-family:var(--font);
    background:
      linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px) 0 0/36px 36px,
      linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px) 0 0/36px 36px,
      radial-gradient(circle at 50% -10%,#35128a 0%,var(--bg) 60%);
    display:flex;justify-content:center;padding:14px 14px 40px;overflow-x:hidden;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);opacity:.35}
  .app{width:100%;max-width:520px;position:relative;z-index:1}

  .logo{text-align:center;margin:6px 0 14px;font-weight:900;font-size:2rem;letter-spacing:.06em;line-height:1}
  .logo .t{color:var(--truth);text-shadow:0 0 14px var(--truth),0 0 34px #3da9ff88}
  .logo .o{color:var(--mute);font-size:1rem;margin:0 6px}
  .logo .d{color:var(--dare);text-shadow:0 0 14px var(--dare),0 0 34px #ff405788}

  #mute{position:fixed;top:12px;right:12px;z-index:5;width:42px;height:42px;border-radius:50%;
    border:2px solid #3a3470;background:#120f2bcc;color:var(--ink);font-size:1.1rem;cursor:pointer;padding:0;margin:0}

  .panel{background:linear-gradient(160deg,#17133a,var(--panel));border:2px solid #2b2560;border-radius:20px;padding:20px;margin-bottom:14px;
    box-shadow:0 0 0 1px #000,0 12px 40px #0008, inset 0 0 40px #6b3bff14}
  .center{text-align:center}.mute{color:var(--mute)}
  .label{font-size:.7rem;letter-spacing:.3em;color:var(--mute);text-transform:uppercase}

  input{width:100%;padding:15px;border-radius:12px;border:2px solid #34306a;background:#0a0820;color:var(--ink);
    font-family:var(--font);font-size:1rem;margin:10px 0 6px;text-align:center;letter-spacing:.06em;outline:none}
  input:focus{border-color:var(--p0);box-shadow:0 0 16px #00f0ff44}

  button.btn{width:100%;padding:16px;margin-top:12px;border:0;border-radius:14px;cursor:pointer;
    font-family:var(--font);font-weight:900;font-size:1rem;letter-spacing:.12em;color:#08071a;
    background:linear-gradient(180deg,#ffe45c,var(--gold));box-shadow:0 5px 0 #a98b00,0 10px 24px #ffd40044;transition:transform .08s, box-shadow .08s}
  button.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a98b00}
  button.btn.go{background:linear-gradient(180deg,#6dffbb,var(--good));box-shadow:0 5px 0 #138a56,0 10px 24px #2cff9a44;}
  button.btn.go:active{box-shadow:0 1px 0 #138a56}
  button.btn.skip{background:linear-gradient(180deg,#38336b,#2a2658);color:var(--ink);box-shadow:0 5px 0 #14113a}
  button.btn.skip:active{box-shadow:0 1px 0 #14113a}
  button.btn.ghost{background:transparent;color:var(--mute);box-shadow:none;border:2px solid #2b2560;font-size:.75rem;padding:10px}
  button:disabled{opacity:.4;cursor:not-allowed}

  /* HUD */
  .hud{display:flex;align-items:stretch;gap:8px;margin-bottom:6px}
  .vs{align-self:center;font-weight:900;color:var(--mute);font-size:.8rem}
  .pcard{flex:1;padding:10px 8px;border-radius:16px;background:#100d28;border:2px solid #2b2560;text-align:center;position:relative;transition:.25s}
  .pcard.p0{--c:var(--p0)} .pcard.p1{--c:var(--p1)}
  .pcard.active{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 18%,transparent)}
  .pname{font-size:.72rem;font-weight:700;color:var(--c);letter-spacing:.08em;word-break:break-word;min-height:1.1em}
  .you{font-size:.55rem;background:var(--c);color:#08071a;padding:1px 5px;border-radius:5px;margin-left:3px;vertical-align:middle}

  /* Pick cards */
  .picks{display:flex;gap:12px}
  .pick{flex:1;padding:30px 8px;border-radius:18px;border:3px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#0a0820),#0a0820);
    color:var(--ink);font-family:var(--font);font-weight:900;font-size:1.2rem;letter-spacing:.1em;cursor:pointer;
    box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent);transition:transform .12s}
  .pick .ic{display:block;font-size:2.6rem;margin-bottom:8px}
  .pick:active{transform:scale(.94)}
  .pick.truth{--c:var(--truth)} .pick.dare{--c:var(--dare)}
  .pick:disabled{opacity:.35;box-shadow:none;cursor:default}
  .pick:not(:disabled){animation:pulse 1.6s infinite}
  @keyframes pulse{50%{box-shadow:0 0 40px color-mix(in srgb,var(--c) 70%,transparent)}}

  /* Question card */
  .qcard{--c:var(--truth);border:3px solid var(--c);border-radius:20px;padding:22px 18px;margin-bottom:14px;position:relative;
    background:linear-gradient(170deg,color-mix(in srgb,var(--c) 20%,#0d0a26),#0d0a26);
    box-shadow:0 0 34px color-mix(in srgb,var(--c) 45%,transparent);animation:flip .55s ease both}
  .qcard.dare{--c:var(--dare)}
  @keyframes flip{from{transform:perspective(800px) rotateY(90deg);opacity:0}to{transform:perspective(800px) rotateY(0);opacity:1}}
  .qtype{display:inline-block;background:var(--c);color:#08071a;font-weight:900;font-size:.8rem;letter-spacing:.2em;padding:5px 14px;border-radius:8px}
  .qcat{float:right;font-size:.62rem;letter-spacing:.2em;color:var(--mute);margin-top:7px;text-transform:uppercase}
  .qtext{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:1.35rem;line-height:1.45;text-align:center;margin:26px 0 22px;clear:both}
  .live{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.7rem;letter-spacing:.2em;color:var(--mute);margin-top:4px}
  .live b{width:9px;height:9px;border-radius:50%;background:var(--dare);box-shadow:0 0 10px var(--dare);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* Waiting / lobby */
  .code{font-size:2.6rem;font-weight:900;letter-spacing:.3em;color:var(--gold);text-shadow:0 0 18px #ffd40088;margin:8px 0 4px;padding-left:.3em}
  .wait{font-size:.75rem;letter-spacing:.22em;color:var(--mute);margin-top:16px;animation:blink 1.4s infinite}
  .matchup{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 10px}
  .avatar{flex:1;padding:18px 6px;border-radius:16px;border:2px solid var(--c);background:#0a0820;font-weight:900;word-break:break-word;color:var(--c);
    text-shadow:0 0 12px var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
  .avatar span{display:block;font-size:2rem;margin-bottom:4px}
  .avatar.p0{--c:var(--p0)} .avatar.p1{--c:var(--p1)}
  .vsbig{font-size:1.6rem;font-weight:900;color:var(--dare);text-shadow:0 0 14px var(--dare)}

  /* Coin */
  .coinwrap{perspective:900px;height:150px;display:flex;align-items:center;justify-content:center;margin:14px 0}
  .coinbounce{animation:toss 2.6s cubic-bezier(.3,.7,.4,1)}
  @keyframes toss{0%{transform:translateY(0)}35%{transform:translateY(-70px)}100%{transform:translateY(0)}}
  .coin{width:120px;height:120px;position:relative;transform-style:preserve-3d;transition:transform 2.5s cubic-bezier(.2,.8,.2,1)}
  .face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
    backface-visibility:hidden;font-weight:900;font-size:.85rem;padding:10px;word-break:break-word;border:5px solid #fff3;color:#08071a;
    box-shadow:inset 0 0 20px #0005,0 0 26px var(--c)}
  .face.f0{background:radial-gradient(circle at 30% 30%,#9ffaff,var(--p0));--c:var(--p0)}
  .face.f1{background:radial-gradient(circle at 30% 30%,#ffe29a,var(--p1));--c:var(--p1);transform:rotateY(180deg)}
  .winner{font-size:1.5rem;font-weight:900;line-height:1.3;color:var(--gold);text-shadow:0 0 18px #ffd40099;margin:4px 0 2px}

  .status{text-align:center;font-size:.62rem;letter-spacing:.18em;margin-top:8px;color:var(--mute);text-transform:uppercase}
  .status.bad{color:var(--dare)} .status.good{color:var(--good)}
  .pop{animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<button id="mute" title="Sound">🔊</button>

<div class="app">
  <div class="logo"><span class="t">TRUTH</span><span class="o">or</span><span class="d">DARE</span></div>
  <div id="view"></div>
  <div id="status" class="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ============================ QUESTION BANK ============================ */
const TRUTHS = {
  "Confession": [
    "What is the biggest lie you have told that you got away with?",
    "What is a secret you have kept from your parents all this time?",
    "What is the worst thing you have said about someone behind their back?",
    "What is the most embarrassing thing you have done to impress someone?",
    "Have you ever pretended to like a gift? What was it?",
    "What is the biggest lie you tell yourself while 'studying'?",
    "Have you ever cheated in an exam? How?",
    "What is the most childish thing you still do?",
    "What is the dumbest thing you have ever cried over?",
    "What is the most trouble you have ever been in?"
  ],
  "Crush & Love": [
    "Who was your last crush, and did they ever find out?",
    "Have you ever liked two people at the same time?",
    "What is the first thing you notice about someone you find attractive?",
    "Have you ever had a crush on a teacher?",
    "Describe your type in exactly three words.",
    "What is the worst pickup line you have ever used or received?",
    "Have you ever been rejected? How bad was it?",
    "Have you ever stalked an ex's or crush's profile? How recently?",
    "What is your idea of a perfect first date?",
    "Have you ever fallen for someone way too fast?"
  ],
  "Awkward": [
    "What is the worst date or hangout you have ever been on?",
    "Have you ever sent a text to the wrong person? What was it?",
    "What is your most embarrassing 'almost got caught' moment?",
    "What is the most cringe thing you have ever posted online?",
    "What is the longest you have gone without a shower?",
    "What is the most awkward thing a stranger has ever said to you?",
    "What is the most desperate thing you have done for attention or likes?",
    "What nickname do you absolutely hate?",
    "What is something you pretend to understand but actually don't?",
    "What is the most embarrassing song on your playlist?"
  ],
  "Petty & Spicy": [
    "What is your biggest red flag?",
    "What is your most toxic trait?",
    "What is the pettiest reason you have stopped talking to someone?",
    "What is the one 'ick' that instantly turns you off?",
    "Who in your contacts would you never want me to text?",
    "What would your friends say is your most annoying habit?",
    "Which friend would be the first to turn on the group in a zombie apocalypse?",
    "Rate your own looks from 1 to 10, honestly.",
    "Who is the most overrated person you know?",
    "What is the one thing you would change about your personality?"
  ],
  "Wild": [
    "What is the weirdest thing you have ever eaten?",
    "If you had to delete one app forever, which would it be?",
    "Which friend would you swap lives with for a week?",
    "What is the most expensive thing you have broken and blamed on someone else?",
    "If you were invisible for a day, what is the first thing you would do?",
    "What is the strangest dream you have had about someone you know?",
    "If you had to marry one person from your contact list, who would it be?",
    "What is the most illegal thing you have ever done, even if it was tiny?",
    "What would you do if you woke up as the opposite gender for a day?",
    "What is your most unpopular opinion that would start a fight?"
  ]
};
const DARES = [
  "Send a heart emoji to the 5th person in your chat list. No explanation.",
  "Read out the last message you sent, in a dramatic voice.",
  "Do your best catwalk across the room.",
  "Sing your favourite song in the most dramatic opera voice you can.",
  "Show the other player your phone's screen-time page.",
  "Do 10 push-ups right now.",
  "Make up a pickup line on the spot and say it with a straight face.",
  "Do your best impression of the other player for 30 seconds.",
  "Speak only in questions for the next 3 turns.",
  "Whisper everything you say for the next 2 turns.",
  "Show the most embarrassing photo in your gallery.",
  "Reenact a famous movie death scene.",
  "Do the worst dance you can for 20 seconds.",
  "Send a voice note to a friend saying 'I miss you' in an over-the-top dramatic voice.",
  "Give the other player an honest first impression of them. No sugar-coating.",
  "Let the other player ask you ONE question. You must answer it honestly.",
  "Make an evil-villain speech about your exam syllabus.",
  "Try to keep eye contact for 30 seconds without laughing.",
  "Change your WhatsApp status to whatever the other player says, for 1 hour.",
  "Talk in a baby voice for the next 2 turns.",
  "Do your best impression of a news anchor reporting your most embarrassing moment.",
  "Take a selfie with the funniest face you can make and show it.",
  "Say the alphabet backwards without making a mistake.",
  "Describe your crush using only emojis. The other player has to guess.",
  "Let the other player pick a nickname for you. You must use it for the rest of the game.",
  "Say something sweet and something petty about the other player.",
  "Act like a chicken until your next turn.",
  "Do your best Bollywood hero entry, slow motion included.",
  "Call someone and sing them a happy birthday, even if it is not their birthday.",
  "Post a blank story with the caption 'thoughts?' and wait for replies.",
  "Do your most dramatic breakup monologue to an imaginary ex.",
  "Eat a spoonful of any weird condiment you find.",
  "Make up a 15-second advertisement for the object closest to you.",
  "Tell the other player your most useless talent, and show it off live."
];
const flatTruths = Object.entries(TRUTHS).flatMap(([cat, arr]) => arr.map(q => ({cat, q})));

/* ============================ GLOBALS ============================ */
const PREFIX = "tod-arcade-";
const $ = id => document.getElementById(id);
let peer = null, conn = null, isHost = false, myIdx = 0, myName = "", roomCode = "";
let state = null, lastLotsId = null, animating = false, lastSig = "";

const roomFromUrl = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
const rand = n => Math.floor(Math.random() * n);
function esc(t){ const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function setStatus(msg, cls = ""){ const s = $("status"); s.textContent = msg; s.className = "status " + cls; }

/* ============================ SOUND ============================ */
let muted = false, ac = null;
function beep(freqs, dur = .09, type = "square", vol = .06){
  if (muted) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t + i * dur);
      g.gain.exponentialRampToValueAtTime(.001, t + (i + 1) * dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i * dur); o.stop(t + (i + 1) * dur);
    });
  }catch(e){}
}
const sfx = {
  click: () => beep([520]),
  reveal: () => beep([330, 440, 660], .08),
  good: () => beep([523, 659, 784], .08),
  coin: () => beep([800, 1000, 1200], .06, "triangle")
};
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; };

/* ============================ HOME ============================ */
function renderHome(){
  $("view").innerHTML = `
    <div class="panel center pop">
      <div class="label">${roomFromUrl ? "Room " + esc(roomFromUrl) : "Player name"}</div>
      <input id="nm" placeholder="ENTER NAME" maxlength="14" value="${esc(myName)}">
      ${roomFromUrl
        ? `<button class="btn go" id="join">JOIN MATCH</button>`
        : `<button class="btn go" id="create">CREATE MATCH</button>
           <div class="label" style="margin:22px 0 0">or join with a code</div>
           <input id="rc" placeholder="ROOM CODE" maxlength="5" style="text-transform:uppercase">
           <button class="btn" id="join">JOIN MATCH</button>`}
    </div>`;
  const name = () => {
    myName = $("nm").value.trim();
    if (!myName){ setStatus("Enter a name", "bad"); $("nm").focus(); return false; }
    return true;
  };
  const c = $("create");
  if (c) c.onclick = () => { if (name()){ sfx.click(); startHost(); } };
  $("join").onclick = () => {
    if (!name()) return;
    const code = roomFromUrl || $("rc").value.trim().toUpperCase();
    if (code.length < 5){ setStatus("Enter the 5-letter room code", "bad"); return; }
    sfx.click(); startGuest(code);
  };
}

function showBusy(msg){
  $("view").innerHTML = `<div class="panel center pop"><div class="wait" style="margin:0 0 6px">${esc(msg)}</div>
    <button class="btn ghost" onclick="location.reload()">CANCEL</button></div>`;
}
function fail(msg){
  $("view").innerHTML = `<div class="panel center pop">
    <div style="font-family:system-ui,sans-serif;line-height:1.5;color:#ff8a98;margin-bottom:6px">${esc(msg)}</div>
    <button class="btn" onclick="location.reload()">TRY AGAIN</button></div>`;
  setStatus("");
}

/* ============================ NETWORKING ============================ */
// STUN + TURN servers help two devices on different networks (Wi-Fi vs mobile data) find each other
const PEER_OPTS = {
  debug: 0,
  config: { iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:global.stun.twilio.com:3478" },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ]}
};

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function ensurePeerLib(){
  if (window.Peer) return true;
  const urls = [
    "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
  ];
  for (const u of urls){
    try{ await loadScript(u); if (window.Peer) return true; }catch(e){}
  }
  return false;
}

function makeCode(){
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
  for (let i = 0; i < 5; i++) s += c[rand(c.length)];
  return s;
}

async function startHost(){
  showBusy("Starting room...");
  if (!(await ensurePeerLib())) return fail("Could not load the connection library. Check your internet, turn off any ad-blocker, and refresh.");
  createRoom(0);
}

function createRoom(attempt){
  isHost = true; myIdx = 0; roomCode = makeCode();
  let opened = false;
  const timer = setTimeout(() => {
    if (!opened) fail("Can't reach the matchmaking server. Check your internet, or turn off VPN / ad-blocker and try again.");
  }, 12000);
  peer = new Peer(PREFIX + roomCode, PEER_OPTS);
  peer.on("error", e => {
    if (e.type === "unavailable-id" && attempt < 5){ clearTimeout(timer); try{ peer.destroy(); }catch(_){} return createRoom(attempt + 1); }
    if (!opened){ clearTimeout(timer); fail("Connection error: " + e.type); }
    else setStatus("Error: " + e.type, "bad");
  });
  peer.on("open", () => {
    opened = true; clearTimeout(timer);
    state = freshState();
    state.players[0] = myName;
    setStatus("Room ready", "good");
    render();
  });
  peer.on("disconnected", () => { try{ peer.reconnect(); }catch(_){} });
  peer.on("connection", c => {
    if (conn && conn.open){ c.on("open", () => c.close()); return; }
    conn = c;
    c.on("data", d => hostHandle(d, 1));
    c.on("close", () => setStatus("Player 2 disconnected", "bad"));
  });
}

async function startGuest(code){
  showBusy("Joining room " + code + "...");
  if (!(await ensurePeerLib())) return fail("Could not load the connection library. Check your internet, turn off any ad-blocker, and refresh.");
  isHost = false; myIdx = 1; roomCode = code;
  let connected = false;
  const timer = setTimeout(() => {
    if (!connected) fail("Could not reach room " + code + ". Make sure the host's tab is still open and the code is correct. If you are on mobile data, try the same Wi-Fi as the host.");
  }, 20000);
  peer = new Peer(PEER_OPTS);
  peer.on("error", e => {
    if (connected){ setStatus("Error: " + e.type, "bad"); return; }
    clearTimeout(timer);
    fail(e.type === "peer-unavailable"
      ? "Room " + code + " not found. Ask the host to keep their page open and check the code."
      : "Connection error: " + e.type);
  });
  peer.on("disconnected", () => { try{ peer.reconnect(); }catch(_){} });
  peer.on("open", () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on("open", () => { connected = true; clearTimeout(timer); conn.send({ t: "join", name: myName }); setStatus("Connected", "good"); });
    conn.on("data", d => { if (d.t === "state"){ state = d.s; render(); } });
    conn.on("close", () => setStatus("Host disconnected. Refresh to rejoin.", "bad"));
    conn.on("error", e => setStatus("Link error", "bad"));
  });
}

function broadcast(){ if (conn && conn.open) conn.send({ t: "state", s: state }); render(); }

function act(action, extra = {}){
  const msg = { t: "act", a: action, ...extra };
  if (isHost) hostHandle(msg, 0);
  else if (conn && conn.open) conn.send(msg);
}

/* ============================ HOST LOGIC ============================ */
function freshState(){
  return { players: [myName, null], phase: "waiting", turn: 0, lots: null, type: null, text: "", cat: "", usedT: [], usedD: [] };
}

function pickQuestion(type){
  const pool = type === "truth" ? flatTruths : DARES;
  const used = type === "truth" ? state.usedT : state.usedD;
  let free = pool.map((_, i) => i).filter(i => !used.includes(i));
  if (!free.length){ used.length = 0; free = pool.map((_, i) => i); }
  const i = free[rand(free.length)];
  used.push(i);
  state.type = type;
  state.text = type === "truth" ? pool[i].q : pool[i];
  state.cat = type === "truth" ? pool[i].cat : "Dare";
}

function hostHandle(d, from){
  if (d.t === "join"){
    state.players[1] = d.name;
    if (state.phase === "waiting") state.phase = "ready";
    setStatus("Both players connected", "good");
    return broadcast();
  }
  if (d.t !== "act") return;
  const mine = state.turn === from;

  switch (d.a){
    case "lots":
      if (state.phase !== "ready") return;
      state.lots = { id: Date.now(), winner: rand(2) };
      state.turn = state.lots.winner;
      state.phase = "lots";
      break;
    case "start":
      if (state.phase !== "lots") return;
      state.phase = "choose";
      break;
    case "choose":
      if (state.phase !== "choose" || !mine) return;
      pickQuestion(d.type);
      state.phase = "prompt";
      break;
    case "skip":
      if (state.phase !== "prompt" || !mine) return;
      pickQuestion(state.type);
      break;
    case "done":
      if (state.phase !== "prompt" || !mine) return;
      state.turn = 1 - state.turn;
      state.phase = "choose";
      break;
  }
  broadcast();
}

/* ============================ RENDER ============================ */
function turnBar(){
  const p = state.players;
  const chip = i => `<div class="pcard p${i} ${state.turn === i ? "active" : ""}">
      <div class="pname">${esc(p[i] || "...")}${i === myIdx ? '<span class="you">YOU</span>' : ""}</div></div>`;
  return `<div class="hud">${chip(0)}<div class="vs">VS</div>${chip(1)}</div>`;
}

function render(){
  if (!state) return renderHome();
  if (animating) return;

  if (state.phase === "lots" && state.lots && state.lots.id !== lastLotsId){
    lastLotsId = state.lots.id; return runCoin();
  }

  const sig = state.phase + state.text;
  if (sig !== lastSig){
    lastSig = sig;
    if (state.phase === "prompt") sfx.reveal();
  }

  const meTurn = state.turn === myIdx;
  const turnName = state.players[state.turn] || "";
  let html = "";

  if (state.phase === "waiting"){
    const web = location.protocol.indexOf("http") === 0;
    const link = location.origin + location.pathname + "?room=" + roomCode;
    $("view").innerHTML = `
      <div class="panel center pop">
        <div class="label">Room code</div>
        <div class="code">${roomCode}</div>
        ${web ? `<button class="btn" id="copy">COPY INVITE LINK</button>`
              : `<div style="font-family:system-ui,sans-serif;color:#ffcf5c;font-size:.85rem;line-height:1.4;margin-top:8px">You opened the file directly, so there is no invite link. Share the code above, or open this game from your GitHub Pages address.</div>`}
        <div class="wait">WAITING FOR PLAYER 2</div>
      </div>`;
    const cp = $("copy");
    if (cp) cp.onclick = () => {
      const done = () => { cp.textContent = "LINK COPIED ✔"; sfx.good(); };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => { cp.textContent = link; });
      else cp.textContent = link;
    };
    return;
  }

  if (state.phase === "ready"){
    html = `
      <div class="panel center pop">
        <div class="matchup">
          <div class="avatar p0"><span>🎮</span>${esc(state.players[0])}</div>
          <div class="vsbig">VS</div>
          <div class="avatar p1"><span>🎮</span>${esc(state.players[1])}</div>
        </div>
        <button class="btn" id="lots">🪙 FLIP COIN</button>
      </div>`;
  }
  else if (state.phase === "lots"){
    html = `
      <div class="panel center pop">
        <div class="label">First turn</div>
        <div class="winner">${esc(turnName)}</div>
        <button class="btn go" id="start">START</button>
      </div>`;
  }
  else if (state.phase === "choose"){
    html = turnBar() + `
      <div class="center label" style="margin:14px 0 12px">${meTurn ? "Your move" : esc(turnName) + " is picking"}</div>
      <div class="picks">
        <button class="pick truth" id="truth" ${meTurn ? "" : "disabled"}><span class="ic">🌶️</span>TRUTH</button>
        <button class="pick dare" id="dare" ${meTurn ? "" : "disabled"}><span class="ic">🔥</span>DARE</button>
      </div>`;
  }
  else if (state.phase === "prompt"){
    html = turnBar() + `
      <div class="qcard ${state.type}" style="margin-top:14px">
        <span class="qtype">${state.type.toUpperCase()}</span><span class="qcat">${esc(state.cat)}</span>
        <div class="qtext">${esc(state.text)}</div>
      </div>
      ${meTurn
        ? `<button class="btn go" id="done">NEXT PLAYER ➜</button>
           <button class="btn skip" id="skip">🔄 NEW ${state.type.toUpperCase()}</button>`
        : `<div class="live"><b></b>${esc(turnName)}</div>`}`;
  }

  $("view").innerHTML = html;
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = () => { sfx.click(); fn(); }; };
  on("lots", () => act("lots"));
  on("start", () => act("start"));
  on("truth", () => act("choose", { type: "truth" }));
  on("dare", () => act("choose", { type: "dare" }));
  on("done", () => act("done"));
  on("skip", () => act("skip"));
}

function runCoin(){
  animating = true;
  const w = state.lots.winner;
  $("view").innerHTML = `
    <div class="panel center">
      <div class="label">Flipping</div>
      <div class="coinwrap"><div class="coinbounce"><div class="coin" id="coin">
        <div class="face f0">${esc(state.players[0])}</div>
        <div class="face f1">${esc(state.players[1])}</div>
      </div></div></div>
    </div>`;
  sfx.coin();
  const coin = $("coin");
  void coin.offsetWidth;
  requestAnimationFrame(() => { coin.style.transform = `rotateY(${360 * 6 + (w ? 180 : 0)}deg)`; });
  setTimeout(() => { sfx.good(); }, 2500);
  setTimeout(() => { animating = false; render(); }, 3100);
}

/* ============================ INIT ============================ */
renderHome();
</script>
</body>
</html>
