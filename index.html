<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRUTH or DARE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070617; --panel:#120f2b; --ink:#f2f0ff; --mute:#8d88b8;
    --p0:#00f0ff; --p1:#ffb300;
    --truth:#3da9ff; --dare:#ff4057; --good:#2cff9a; --gold:#ffd400;
    --font:'Orbitron','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100vh; color:var(--ink); font-family:var(--font);
    background:
      linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px) 0 0/36px 36px,
      linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px) 0 0/36px 36px,
      radial-gradient(circle at 50% -10%,#35128a 0%,var(--bg) 60%);
    display:flex;justify-content:center;padding:14px 14px 40px;overflow-x:hidden;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);opacity:.35}
  .app{width:100%;max-width:520px;position:relative;z-index:1}

  .logo{text-align:center;margin:6px 0 14px;font-weight:900;font-size:2rem;letter-spacing:.06em;line-height:1}
  .logo .t{color:var(--truth);text-shadow:0 0 14px var(--truth),0 0 34px #3da9ff88}
  .logo .o{color:var(--mute);font-size:1rem;margin:0 6px}
  .logo .d{color:var(--dare);text-shadow:0 0 14px var(--dare),0 0 34px #ff405788}

  #mute{position:fixed;top:12px;right:12px;z-index:5;width:42px;height:42px;border-radius:50%;
    border:2px solid #3a3470;background:#120f2bcc;color:var(--ink);font-size:1.1rem;cursor:pointer;padding:0;margin:0}

  .panel{background:linear-gradient(160deg,#17133a,var(--panel));border:2px solid #2b2560;border-radius:20px;padding:20px;margin-bottom:14px;
    box-shadow:0 0 0 1px #000,0 12px 40px #0008, inset 0 0 40px #6b3bff14}
  .center{text-align:center}.mute{color:var(--mute)}
  .label{font-size:.7rem;letter-spacing:.3em;color:var(--mute);text-transform:uppercase}

  input{width:100%;padding:15px;border-radius:12px;border:2px solid #34306a;background:#0a0820;color:var(--ink);
    font-family:var(--font);font-size:1rem;margin:10px 0 6px;text-align:center;letter-spacing:.06em;outline:none}
  input:focus{border-color:var(--p0);box-shadow:0 0 16px #00f0ff44}

  button.btn{width:100%;padding:16px;margin-top:12px;border:0;border-radius:14px;cursor:pointer;
    font-family:var(--font);font-weight:900;font-size:1rem;letter-spacing:.12em;color:#08071a;
    background:linear-gradient(180deg,#ffe45c,var(--gold));box-shadow:0 5px 0 #a98b00,0 10px 24px #ffd40044;transition:transform .08s, box-shadow .08s}
  button.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a98b00}
  button.btn.go{background:linear-gradient(180deg,#6dffbb,var(--good));box-shadow:0 5px 0 #138a56,0 10px 24px #2cff9a44;}
  button.btn.go:active{box-shadow:0 1px 0 #138a56}
  button.btn.skip{background:linear-gradient(180deg,#38336b,#2a2658);color:var(--ink);box-shadow:0 5px 0 #14113a}
  button.btn.skip:active{box-shadow:0 1px 0 #14113a}
  button.btn.ghost{background:transparent;color:var(--mute);box-shadow:none;border:2px solid #2b2560;font-size:.75rem;padding:10px}
  button:disabled{opacity:.4;cursor:not-allowed}

  /* HUD */
  .hud{display:flex;align-items:stretch;gap:8px;margin-bottom:6px}
  .vs{align-self:center;font-weight:900;color:var(--mute);font-size:.8rem}
  .pcard{flex:1;padding:10px 8px;border-radius:16px;background:#100d28;border:2px solid #2b2560;text-align:center;position:relative;transition:.25s}
  .pcard.p0{--c:var(--p0)} .pcard.p1{--c:var(--p1)}
  .pcard.active{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 18%,transparent)}
  .pname{font-size:.72rem;font-weight:700;color:var(--c);letter-spacing:.08em;word-break:break-word;min-height:1.1em}
  .you{font-size:.55rem;background:var(--c);color:#08071a;padding:1px 5px;border-radius:5px;margin-left:3px;vertical-align:middle}
  .pscore{font-size:2.2rem;font-weight:900;margin:2px 0;text-shadow:0 0 14px var(--c)}
  .bar{height:7px;border-radius:9px;background:#1d1948;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
  .streak{font-size:.7rem;color:#ff9a3d;height:1em;margin-top:5px;font-weight:700}
  .round{text-align:center;font-size:.65rem;letter-spacing:.25em;color:var(--mute);margin:10px 0 14px}

  /* Pick cards */
  .picks{display:flex;gap:12px}
  .pick{flex:1;padding:30px 8px;border-radius:18px;border:3px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#0a0820),#0a0820);
    color:var(--ink);font-family:var(--font);font-weight:900;font-size:1.2rem;letter-spacing:.1em;cursor:pointer;
    box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent);transition:transform .12s}
  .pick .ic{display:block;font-size:2.6rem;margin-bottom:8px}
  .pick:active{transform:scale(.94)}
  .pick.truth{--c:var(--truth)} .pick.dare{--c:var(--dare)}
  .pick:disabled{opacity:.35;box-shadow:none;cursor:default}
  .pick:not(:disabled){animation:pulse 1.6s infinite}
  @keyframes pulse{50%{box-shadow:0 0 40px color-mix(in srgb,var(--c) 70%,transparent)}}

  /* Question card */
  .qcard{--c:var(--truth);border:3px solid var(--c);border-radius:20px;padding:22px 18px;margin-bottom:14px;position:relative;
    background:linear-gradient(170deg,color-mix(in srgb,var(--c) 20%,#0d0a26),#0d0a26);
    box-shadow:0 0 34px color-mix(in srgb,var(--c) 45%,transparent);animation:flip .55s ease both}
  .qcard.dare{--c:var(--dare)}
  @keyframes flip{from{transform:perspective(800px) rotateY(90deg);opacity:0}to{transform:perspective(800px) rotateY(0);opacity:1}}
  .qtype{display:inline-block;background:var(--c);color:#08071a;font-weight:900;font-size:.8rem;letter-spacing:.2em;padding:5px 14px;border-radius:8px}
  .qcat{float:right;font-size:.62rem;letter-spacing:.2em;color:var(--mute);margin-top:7px;text-transform:uppercase}
  .qtext{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:1.35rem;line-height:1.45;text-align:center;margin:26px 0 22px;clear:both}
  .timer{height:8px;border-radius:9px;background:#1d1948;overflow:hidden}
  .timer i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 10px var(--c);animation:shrink linear forwards;transform-origin:left}
  @keyframes shrink{to{width:0}}
  .live{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.7rem;letter-spacing:.2em;color:var(--mute);margin-top:4px}
  .live b{width:9px;height:9px;border-radius:50%;background:var(--dare);box-shadow:0 0 10px var(--dare);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}

  /* Waiting / lobby */
  .code{font-size:2.6rem;font-weight:900;letter-spacing:.3em;color:var(--gold);text-shadow:0 0 18px #ffd40088;margin:8px 0 4px;padding-left:.3em}
  .wait{font-size:.75rem;letter-spacing:.22em;color:var(--mute);margin-top:16px;animation:blink 1.4s infinite}
  .matchup{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 10px}
  .avatar{flex:1;padding:18px 6px;border-radius:16px;border:2px solid var(--c);background:#0a0820;font-weight:900;word-break:break-word;color:var(--c);
    text-shadow:0 0 12px var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
  .avatar span{display:block;font-size:2rem;margin-bottom:4px}
  .avatar.p0{--c:var(--p0)} .avatar.p1{--c:var(--p1)}
  .vsbig{font-size:1.6rem;font-weight:900;color:var(--dare);text-shadow:0 0 14px var(--dare)}

  /* Coin */
  .coinwrap{perspective:900px;height:150px;display:flex;align-items:center;justify-content:center;margin:14px 0}
  .coinbounce{animation:toss 2.6s cubic-bezier(.3,.7,.4,1)}
  @keyframes
